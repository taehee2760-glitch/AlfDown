name: Build AlfDown Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install --upgrade pyinstaller pillow
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AlfDown --icon treble.ico --add-data "treble.ico;." S3_downloader.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: AlfDown-Windows
          path: dist/AlfDown.exe
