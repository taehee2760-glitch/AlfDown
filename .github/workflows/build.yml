name: Build AlfDown Windows Folder

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pyinstaller==6.16.0 pillow==11.3.0
      - name: Build folder-based EXE
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name AlfDown --icon treble.ico --add-data "treble.ico;." S3_downloader.py
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          (Get-FileHash dist/AlfDown/AlfDown.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii dist/AlfDown/AlfDown.exe.sha256
      - name: Upload folder
        uses: actions/upload-artifact@v4
        with:
          name: AlfDown-Windows-Folder
          path: dist/AlfDown/
          if-no-files-found: error
