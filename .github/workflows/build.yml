name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller pillow
      - name: Build AlfDown
        run: python -m PyInstaller --noconfirm --onefile --windowed --name AlfDown S3_downloader.py
      - uses: actions/upload-artifact@v4
        with:
          name: AlfDown-Windows
          path: dist/AlfDown.exe
